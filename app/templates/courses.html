{% extends 'base.html' %}{% block content %}<p class="eyebrow">УЧЕБНЫЕ МАТЕРИАЛЫ</p><h1>Мои курсы</h1><div class="cards">{% for c in courses %}<a class="card course-card" href="/courses/{{c.id}}"><span class="tag">{{c.direction}}</span><div class="course-number">{{c.grade or '∑'}}<small>класс</small></div><h2>{{c.title}}</h2><p>{{c.description}}</p><span>Открыть программу ↗</span></a>{% else %}<p>Преподаватель ещё не открыл доступ к курсам.</p>{% endfor %}</div>{% endblock %}
