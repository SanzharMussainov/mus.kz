{% extends 'base.html' %}{% block content %}<p class="eyebrow">ЛИЧНЫЕ ДАННЫЕ</p><h1>Профиль</h1><p>{{user.name}} · {{user.email}}</p><form class="card form" method="post"><input type="hidden" name="csrf" value="{{csrf}}"><label>Телефон WhatsApp<input name="phone" value="{{user.phone}}" maxlength="40"></label><label>Контакт родителя<input name="parent_contact" value="{{user.parent_contact}}" maxlength="300"></label><h2>Изменить пароль</h2><label>Текущий пароль<input name="old_password" type="password" autocomplete="current-password"></label><label>Новый пароль (минимум 10 символов)<input name="password" type="password" autocomplete="new-password" minlength="10" maxlength="200"></label><button>Сохранить</button></form>{% endblock %}
